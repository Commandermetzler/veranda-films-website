<style>
/* Layout: eine Spalte, Tages-Reiter oben (sticky), je Konto eine Karte mit großem Kopier-Knopf — fürs iPhone gebaut */
:root{
  --bg:#0b1020; --card:#141b30; --line:#26304d; --fg:#f2ede4; --muted:#a4acc2; --gold:#ffd08a; --gold-ink:#2a1c06; --ok:#7fd8a6;
  --f-ui:"Avenir Next","Segoe UI",system-ui,sans-serif; --f-text:"SF Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-ui);font-size:17px;line-height:1.45;padding:0 16px 48px;max-width:640px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:14px 10px;z-index:2;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:8px 14px;font:600 15px var(--f-ui)}
.tab[aria-selected="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.tab small{font-weight:500;opacity:.8}
main{display:grid;gap:14px;padding-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.card.done{opacity:.55}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.nr{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.handle{color:var(--gold);font-weight:700;font-size:19px;text-decoration:none;word-break:break-all}
.info{color:var(--muted);font-size:14px}
.zeit{color:var(--fg);font-weight:600}
.msg{white-space:pre-wrap;font:14px/1.5 var(--f-text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;user-select:text;-webkit-user-select:text;overflow-wrap:anywhere}
.row{display:flex;gap:10px}
.copy{flex:1;min-height:52px;border:0;border-radius:12px;background:var(--gold);color:var(--gold-ink);font:700 18px var(--f-ui)}
.copy.ok{background:var(--ok)}
.sent{min-height:52px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--fg);font:600 15px var(--f-ui)}
.sent[aria-pressed="true"]{border-color:var(--ok);color:var(--ok)}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hint{color:var(--muted);font-size:13px;margin:18px 0 0}
</style>

const KEY = "veranda-dm-gesendet";
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function store(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
let sent = load();
function heuteBali(){const d=new Date(Date.now()+8*3600e3);return d.toISOString().slice(0,10)}
let aktiv = (DATA.find(t=>t.id===heuteBali())||DATA[0]).id;
const tabs=document.getElementById("tabs"), list=document.getElementById("list");
function renderTabs(){
  tabs.innerHTML="";
  DATA.forEach(t=>{
    const n=t.eintraege.filter(e=>sent[t.id+e.handle]).length;
    const b=document.createElement("button");
    b.className="tab";b.id="tab-"+t.id;b.setAttribute("role","tab");
    b.setAttribute("aria-selected",String(t.id===aktiv));
    b.innerHTML=t.label+" <small>"+n+"/"+t.eintraege.length+"</small>";
    b.onclick=()=>{aktiv=t.id;render()};
    tabs.appendChild(b);
  });
}
async function kopieren(text,btn,pre){
  let ok=false;
  try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
  if(!ok){
    const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);
    try{ok=document.execCommand("copy")}catch(e){}
  }
  btn.textContent=ok?"Kopiert ✓":"Markiert – jetzt „Kopieren“ tippen";
  btn.classList.toggle("ok",ok);
  setTimeout(()=>{btn.textContent="Kopieren";btn.classList.remove("ok")},2500);
}
function render(){
  renderTabs();
  const t=DATA.find(x=>x.id===aktiv);
  list.innerHTML="";
  t.eintraege.forEach(e=>{
    const id=t.id+e.handle, done=!!sent[id];
    const c=document.createElement("article");c.className="card"+(done?" done":"");
    c.innerHTML=`<div class="top"><span class="nr">${e.nr}</span><a class="handle" href="${e.url}" target="_blank" rel="noopener">${e.handle}</a></div>
      <div class="info">${e.info} · <span class="zeit">${e.zeit}</span></div>`;
    const pre=document.createElement("pre");pre.className="msg";pre.textContent=e.text;
    const row=document.createElement("div");row.className="row";
    const cb=document.createElement("button");cb.className="copy";cb.id="copy-"+id;cb.textContent="Kopieren";
    cb.onclick=()=>kopieren(e.text,cb,pre);
    const sb=document.createElement("button");sb.className="sent";sb.id="sent-"+id;sb.setAttribute("aria-pressed",String(done));
    sb.textContent=done?"Gesendet ✓":"Gesendet";
    sb.onclick=()=>{sent[id]=!sent[id];if(!sent[id])delete sent[id];store(sent);render()};
    row.append(cb,sb);c.append(pre,row);list.appendChild(c);
  });
}
render();
</script>
